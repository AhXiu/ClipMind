openapi: 3.0.3
info:
  title: ClipMind API
  version: 1.1.0
  description: Android 采集、知识关联、阅读内化与卡片管理。reading POST 无状态、128 KiB、25 秒超时，与知识归纳共享两个并发槽，不自动重试或发布。仅配置能力不代表可用性与效果验收。
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/reading/capabilities:
    get:
      summary: 查询阅读、检索与向量配置，不发送原文
      responses:
        '200':
          description: 已配置的能力；空 embedding_model 表示未启用
          content:
            application/json:
              schema:
                type: object
                required: [reading, search, embedding_model]
                properties:
                  reading: { type: boolean }
                  search: { type: boolean }
                  embedding_model: { type: string }
        '401': { description: 未认证 }
  /v1/reading:analyze:
    post:
      summary: 忠于原文的完整解读、受控标签、真实书目及可选文章
      description: 客户端须预览原文及历史标签/已读标题范围并确认。模型由服务端配置，不接受客户端 URL 或 API Key。搜索缺失/失败以 warnings 显式告知；无已验证书目返回空列表。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadingRequest' }
      responses:
        '200':
          description: 结构已校验，语义仍需核对
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingResponse' }
        '400': { description: 格式、敏感内容或范围不合法 }
        '401': { description: 未认证 }
        '429': { description: 并发已满 }
        '502': { description: 依赖或模型输出校验失败 }
        '503': { description: 未配置 }
  /v1/reading:embed:
    post:
      summary: 生成用于端侧索引的真实语义向量
      description: 固定调用 OpenAI embeddings；每批 1–16 条，总共最多 16000 个 Unicode 字符。客户端按模型和原文修订缓存，本地余弦 Top-20 中保留最近两条再多样性重排至最多5条；非正相似度不用于推断对立。本接口不保存向量库。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [texts]
              properties:
                texts:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items: { type: string, minLength: 1, maxLength: 6000 }
      responses:
        '200':
          description: 已按输入顺序重排，精确模型身份一致、有限非零且维度一致
          content:
            application/json:
              schema:
                type: object
                required: [model, vectors]
                properties:
                  model: { type: string }
                  vectors:
                    type: array
                    minItems: 1
                    maxItems: 16
                    items:
                      type: array
                      minItems: 8
                      maxItems: 4096
                      items: { type: number, format: double }
        '400': { description: JSON 格式错误 }
        '401': { description: 未认证 }
        '429': { description: 并发已满 }
        '502': { description: 输入范围/安全校验、向量模型或依赖校验失败 }
        '503': { description: 向量服务未配置 }
  /v1/reading:weekly:
    post:
      summary: 按明确给定的本周原文生成带引用的观点和主线
      description: 客户端本地计算自然周、卡片数量和高频标签。最多 2000 张，总原文最多 16000 字。空周在客户端处理。响应是 KnowledgeResult 本体，没有 result 包装；relations 必须为空。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cards]
              properties:
                cards:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, revision, text]
                    properties:
                      id: { type: string, minLength: 1 }
                      revision: { type: integer, format: int64, minimum: 1 }
                      text: { type: string, minLength: 1, maxLength: 6000 }
      responses:
        '200':
          description: 原文引用和比较来源已校验
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeeklyResult' }
        '400': { description: 格式、范围或敏感内容不合法 }
        '401': { description: 未认证 }
        '429': { description: 并发已满 }
        '502': { description: 模型或引用校验失败 }
        '503': { description: 未配置 }
  /v1/reading:recommend:
    post:
      summary: 根据低覆盖分类探索不同主题的真实书籍
      description: 全量历史的本地一级分类统计不是用户真实能力判断。排除已读及历史推荐标题；最多两个主题各一本，按标题/作者去重。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [counts, read_books, previous_books]
              properties:
                counts:
                  type: object
                  maxProperties: 7
                  description: key 仅限固定一级分类
                  additionalProperties: { type: integer, minimum: 0, maximum: 1000000 }
                read_books:
                  type: array
                  description: 与 previous_books 合计不超过 1000 条
                  items: { type: string, minLength: 1, maxLength: 300 }
                previous_books:
                  type: array
                  items: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          description: 没有已验证书目时不编造推荐
          content:
            application/json:
              schema:
                type: object
                required: [focus_topics, books, basis]
                properties:
                  focus_topics: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/PrimaryTag' } }
                  books: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/VerifiedBook' } }
                  basis: { type: string }
        '400': { description: JSON 格式错误 }
        '401': { description: 未认证 }
        '429': { description: 并发已满 }
        '502': { description: 输入范围/安全校验或模型输出校验失败 }
        '503': { description: 未配置 }
  /v1/knowledge:synthesize:
    post:
      summary: 归纳用户明确选定的多张卡片并返回带原文证据的关系候选
      description: 无状态处理，仅使用请求内正文，不按 ID 查询或扩展知识库。固定使用服务端配置的模型，不接受模型地址或 API Key。最多 2 个并发请求，20 秒超时，不自动重试、不发布到 Obsidian。客户端须先确认发送范围。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeRequest' }
      responses:
        '200':
          description: 引用已匹配原文，结论仍需人工核对
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeResponse' }
        '400': { description: 输入范围、敏感内容或格式校验失败 }
        '401': { description: 未认证 }
        '429': { description: 并发已满 }
        '502': { description: 模型调用、JSON 或引用校验失败 }
        '503': { description: 归纳能力未配置 }
  /health:
    get:
      security: []
      responses:
        '200': { description: 服务健康 }
  /metrics:
    get:
      security: []
      responses:
        '200': { description: 进程内指标快照 }
  /v1/captures:batch:
    post:
      summary: 批量提交端侧摘抄
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureBatchRequest' }
      responses:
        '202':
          description: 已处理，逐项返回接收或拒绝结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureBatchResponse' }
        '400': { description: 请求格式错误 }
        '401': { description: 未认证 }
  /v1/cards/{cardId}:
    get:
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200': { description: 当前卡片 }
        '404': { description: 卡片不存在 }
  /v1/cards/{cardId}/versions:
    get:
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: 不可变卡片版本列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CardVersion' }
  /v1/cards/{cardId}/confirm:
    post:
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200': { description: 已确认并触发发布同步 }
        '409': { description: 当前状态不允许确认 }
  /v1/cards/{cardId}/analyses:
    post:
      summary: 在原卡片上创建新的分析任务并保留历史版本
      description: 仅允许 awaiting_confirm、synced、ai_failed 状态。新 client_capture_id 标识新任务，重试必须保持 ID 和正文不变。重新生成强制 confirm 模式，不自动覆盖 Obsidian。
      parameters:
        - $ref: '#/components/parameters/CardId'
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipEvent' }
      responses:
        '200':
          description: 新任务已接收或逐项验证拒绝；同一幂等键返回原响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureBatchResponse' }
        '400': { description: 请求格式或幂等键错误 }
        '401': { description: 未认证 }
        '404': { description: 原卡片不存在 }
        '409': { description: 原卡片仍在处理或同步中，或任务 ID 属于其他卡片 }
  /v1/cards/{cardId}/rollback:
    post:
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id]
              properties:
                version_id: { type: string }
      responses:
        '200': { description: 已切换活动版本 }
        '409': { description: 当前状态不允许回滚 }
  /v1/cards/{cardId}/sync:retry:
    post:
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200': { description: 已重新触发单向同步 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CardId:
      in: path
      name: cardId
      required: true
      schema: { type: string }
  schemas:
    PrimaryTag:
      type: string
      enum: [人文, 商业, 技术, 认知, 职场, 社会, 随笔]
    ReadingRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 6000 }
        known_tags:
          type: array
          maxItems: 200
          description: 已确认二级标签，不得包含一级分类；优先复用
          items: { type: string, minLength: 1, maxLength: 30 }
        read_books:
          type: array
          maxItems: 500
          items: { type: string, minLength: 1, maxLength: 300 }
        search_articles: { type: boolean, default: false }
    TagSuggestion:
      type: object
      required: [name, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        status: { type: string, enum: [reused, pending] }
    VerifiedBook:
      type: object
      required: [title, verified, openlibrary_key, confidence]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        author: { type: string, maxLength: 200 }
        verified: { type: boolean, enum: [true] }
        openlibrary_key: { type: string, pattern: '^/works/OL[0-9]+W$' }
        confidence: { type: string, enum: [semantic, speculative], description: 元数据不可证明原文出处，高确定需客户端人工出处证据 }
        reason: { type: string, maxLength: 300 }
        topic: { type: string }
    ReadingResponse:
      type: object
      required: [schema_version, provider, model, primary_tag, interpretation, secondary_tags, keywords, books, articles, value, value_reason, questions, warnings]
      properties:
        schema_version: { type: integer, enum: [2] }
        provider: { type: string }
        model: { type: string }
        primary_tag: { $ref: '#/components/schemas/PrimaryTag' }
        interpretation:
          type: object
          required: [summary, insight, action]
          properties:
            summary: { type: string, minLength: 1, maxLength: 4000, description: 核心释义 }
            insight: { type: string, minLength: 1, maxLength: 4000, description: 场景应用 }
            action: { type: string, minLength: 1, maxLength: 4000, description: 认知启发 }
        secondary_tags: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/TagSuggestion' } }
        keywords: { type: array, minItems: 3, maxItems: 3, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 30 } }
        books: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/VerifiedBook' } }
        articles:
          type: array
          maxItems: 3
          items:
            type: object
            required: [title, url, summary, checked_at]
            properties:
              title: { type: string, maxLength: 300 }
              url: { type: string, format: uri, description: 白名单 HTTPS 实际访问成功，不保证未来永久可达 }
              summary: { type: string, minLength: 1, maxLength: 200 }
              checked_at: { type: string, format: date-time }
              relation: { type: string, enum: [supports, contradicts, extends, example], description: 新结果中为文章对摘抄的关系；旧缓存可缺省，均为待核对推论 }
              reason: { type: string, minLength: 1, maxLength: 200, description: 具体阅读增量与比较边界，与其他增强字段同时出现 }
              quote: { type: string, minLength: 20, maxLength: 200, description: 服务端校验过的连续文章正文引文 }
              source_quote: { type: string, minLength: 1, maxLength: 200, description: 对应摘抄的连续原文，至少12字或不足12字时全文 }
        value: { type: string, enum: [high, medium, low] }
        value_reason: { type: string }
        questions: { type: array, maxItems: 3, description: high 时至少两题, items: { type: string, minLength: 1, maxLength: 200 } }
        warnings: { type: array, items: { type: string } }
    WeeklyResult:
      type: object
      required: [title, points, relations]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        points:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            required: [kind, text, evidence]
            properties:
              kind: { type: string, enum: [summary, agreement, difference, question] }
              text: { type: string, minLength: 1, maxLength: 1200 }
              evidence: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/KnowledgeEvidence' } }
        relations: { type: array, maxItems: 0, items: { $ref: '#/components/schemas/KnowledgeRelation' } }
    KnowledgeRequest:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          minItems: 2
          maxItems: 8
          description: ID 唯一，总正文不超过 16000 个 Unicode 字符，完整请求不超过 128 KiB。
          items:
            type: object
            additionalProperties: false
            required: [id, revision, text]
            properties:
              id: { type: string, minLength: 1, maxLength: 40, description: 客户端引用标识，不用于服务端查询 }
              revision: { type: integer, format: int64, minimum: 1 }
              text: { type: string, minLength: 1, maxLength: 6000 }
    KnowledgeEvidence:
      type: object
      additionalProperties: false
      required: [card_id, quote]
      properties:
        card_id: { type: string, description: 必须来自本次请求 }
        quote: { type: string, minLength: 1, maxLength: 400, description: 必须是对应卡片的连续原文 }
    KnowledgeRelation:
      type: object
      description: v2中每个无序卡片对最多一条关系；非same_topic双方引文至少12字，原文不足12字时引用全文。语义及适用边界仍需人工核对。
      additionalProperties: false
      required: [source_id, target_id, type, reason, source_quote, target_quote]
      properties:
        source_id: { type: string }
        target_id: { type: string, description: 不得等于 source_id }
        type: { type: string, enum: [same_topic, supports, contradicts, extends, example] }
        reason: { type: string, minLength: 1, maxLength: 600 }
        source_quote: { type: string, minLength: 1, maxLength: 400 }
        target_quote: { type: string, minLength: 1, maxLength: 400 }
    KnowledgeResponse:
      type: object
      required: [result, provider, model, prompt_version]
      properties:
        provider: { type: string, enum: [ark, openrouter, kimi, glm, openai, deterministic] }
        model: { type: string }
        prompt_version: { type: string, enum: [knowledge-v1, knowledge-v2], description: 新服务端与BYOK输出v2；新客户端兼容读取v1历史结果 }
        result:
          type: object
          additionalProperties: false
          required: [title, points, relations]
          properties:
            title: { type: string, minLength: 1, maxLength: 80 }
            points:
              type: array
              minItems: 1
              maxItems: 16
              description: 所有已选卡片至少被引用一次；共同观点和分歧必须引用至少两张不同卡片。
              items:
                type: object
                additionalProperties: false
                required: [kind, text, evidence]
                properties:
                  kind: { type: string, enum: [summary, agreement, difference, question] }
                  text: { type: string, minLength: 1, maxLength: 1200 }
                  evidence:
                    type: array
                    minItems: 1
                    maxItems: 8
                    items: { $ref: '#/components/schemas/KnowledgeEvidence' }
            relations:
              type: array
              maxItems: 12
              items: { $ref: '#/components/schemas/KnowledgeRelation' }
    CaptureBatchRequest:
      type: object
      required: [captures]
      additionalProperties: false
      properties:
        captures:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ClipEvent' }
    ClipEvent:
      type: object
      required: [client_capture_id, raw_text, mode]
      additionalProperties: false
      properties:
        client_capture_id: { type: string, minLength: 1 }
        raw_text: { type: string, minLength: 1 }
        text_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: raw_text UTF-8 字节的小写 SHA-256，可选但提供时必须匹配。
        source_app: { type: string }
        source_url: { type: string }
        mode: { type: string, enum: [auto, confirm] }
        captured_at: { type: string, format: date-time }
        client_analysis: { $ref: '#/components/schemas/ClientAnalysis' }
    ClientAnalysis:
      type: object
      additionalProperties: false
      required: [provider, model, primary_tag, interpretation, books]
      description: 客户端 BYOK 的结构化结果；API key 不得提交到 backend。
      properties:
        schema_version: { type: integer, description: 2 表示核心释义/场景应用/认知启发；缺省保留旧模板 }
        provider: { type: string, enum: [ark, openrouter, kimi, glm, openai] }
        model: { type: string, minLength: 1, maxLength: 200 }
        primary_tag: { type: string, enum: [人文, 商业, 技术, 认知, 职场, 社会, 随笔] }
        interpretation: { $ref: '#/components/schemas/Interpretation' }
        books:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ClientBook' }
    Interpretation:
      type: object
      additionalProperties: false
      required: [summary, insight, action]
      properties:
        summary: { type: string, minLength: 1, maxLength: 2000 }
        insight: { type: string, minLength: 1, maxLength: 4000 }
        action: { type: string, minLength: 1, maxLength: 2000 }
    ClientBook:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        author: { type: string, maxLength: 200 }
    CardVersion:
      type: object
      required: [id, card_id, number, created_at, clean_text, primary_tag, interpretation, books, llm_provider, llm_model, markdown]
      properties:
        schema_version: { type: integer }
        secondary_tags: { type: array, items: { $ref: '#/components/schemas/TagSuggestion' } }
        keywords: { type: array, items: { type: string } }
        id: { type: string }
        card_id: { type: string }
        number: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        clean_text: { type: string }
        primary_tag: { type: string }
        interpretation: { $ref: '#/components/schemas/Interpretation' }
        books: { type: array, items: { type: object } }
        llm_provider: { type: string, enum: [ark, openrouter, kimi, glm, openai, deterministic] }
        llm_model: { type: string }
        markdown: { type: string }
    AcceptedCapture:
      type: object
      required: [client_capture_id, capture_id, card_id]
      properties:
        client_capture_id: { type: string }
        capture_id: { type: string }
        card_id: { type: string }
        duplicate: { type: boolean }
    RejectedCapture:
      type: object
      required: [code, message]
      properties:
        client_capture_id: { type: string }
        code: { type: string }
        message: { type: string }
    CaptureBatchResponse:
      type: object
      required: [accepted, rejected]
      properties:
        accepted:
          type: array
          items: { $ref: '#/components/schemas/AcceptedCapture' }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/RejectedCapture' }
