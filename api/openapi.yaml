openapi: 3.0.3
info:
  title: ClipMind Phase 1 API
  version: 1.0.0
  description: Android 采集、卡片查询、确认、回滚和同步重试接口。
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/knowledge:synthesize:
    post:
      summary: 归纳用户明确选定的多张卡片并返回带原文证据的关系候选
      description: 无状态处理，仅使用请求内正文，不按 ID 查询或扩展知识库。固定使用服务端配置的模型，不接受模型地址或 API Key。最多 2 个并发请求，20 秒超时，不自动重试、不发布到 Obsidian。客户端须先确认发送范围。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeRequest' }
      responses:
        '200':
          description: 引用已匹配原文，结论仍需人工核对
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeResponse' }
        '400': { description: 输入范围、敏感内容或格式校验失败 }
        '401': { description: 未认证 }
        '429': { description: 并发已满 }
        '502': { description: 模型调用、JSON 或引用校验失败 }
        '503': { description: 归纳能力未配置 }
  /health:
    get:
      security: []
      responses:
        '200': { description: 服务健康 }
  /metrics:
    get:
      security: []
      responses:
        '200': { description: 进程内指标快照 }
  /v1/captures:batch:
    post:
      summary: 批量提交端侧摘抄
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureBatchRequest' }
      responses:
        '202':
          description: 已处理，逐项返回接收或拒绝结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureBatchResponse' }
        '400': { description: 请求格式错误 }
        '401': { description: 未认证 }
  /v1/cards/{cardId}:
    get:
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200': { description: 当前卡片 }
        '404': { description: 卡片不存在 }
  /v1/cards/{cardId}/versions:
    get:
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: 不可变卡片版本列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CardVersion' }
  /v1/cards/{cardId}/confirm:
    post:
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200': { description: 已确认并触发发布同步 }
        '409': { description: 当前状态不允许确认 }
  /v1/cards/{cardId}/analyses:
    post:
      summary: 在原卡片上创建新的分析任务并保留历史版本
      description: 仅允许 awaiting_confirm、synced、ai_failed 状态。新 client_capture_id 标识新任务，重试必须保持 ID 和正文不变。重新生成强制 confirm 模式，不自动覆盖 Obsidian。
      parameters:
        - $ref: '#/components/parameters/CardId'
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClipEvent' }
      responses:
        '200':
          description: 新任务已接收或逐项验证拒绝；同一幂等键返回原响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureBatchResponse' }
        '400': { description: 请求格式或幂等键错误 }
        '401': { description: 未认证 }
        '404': { description: 原卡片不存在 }
        '409': { description: 原卡片仍在处理或同步中，或任务 ID 属于其他卡片 }
  /v1/cards/{cardId}/rollback:
    post:
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_id]
              properties:
                version_id: { type: string }
      responses:
        '200': { description: 已切换活动版本 }
        '409': { description: 当前状态不允许回滚 }
  /v1/cards/{cardId}/sync:retry:
    post:
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200': { description: 已重新触发单向同步 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CardId:
      in: path
      name: cardId
      required: true
      schema: { type: string }
  schemas:
    KnowledgeRequest:
      type: object
      additionalProperties: false
      required: [cards]
      properties:
        cards:
          type: array
          minItems: 2
          maxItems: 8
          description: ID 唯一，总正文不超过 16000 个 Unicode 字符，完整请求不超过 128 KiB。
          items:
            type: object
            additionalProperties: false
            required: [id, revision, text]
            properties:
              id: { type: string, minLength: 1, maxLength: 40, description: 客户端引用标识，不用于服务端查询 }
              revision: { type: integer, format: int64, minimum: 1 }
              text: { type: string, minLength: 1, maxLength: 6000 }
    KnowledgeEvidence:
      type: object
      additionalProperties: false
      required: [card_id, quote]
      properties:
        card_id: { type: string, description: 必须来自本次请求 }
        quote: { type: string, minLength: 1, maxLength: 400, description: 必须是对应卡片的连续原文 }
    KnowledgeRelation:
      type: object
      additionalProperties: false
      required: [source_id, target_id, type, reason, source_quote, target_quote]
      properties:
        source_id: { type: string }
        target_id: { type: string, description: 不得等于 source_id }
        type: { type: string, enum: [same_topic, supports, contradicts, extends, example] }
        reason: { type: string, minLength: 1, maxLength: 600 }
        source_quote: { type: string, minLength: 1, maxLength: 400 }
        target_quote: { type: string, minLength: 1, maxLength: 400 }
    KnowledgeResponse:
      type: object
      required: [result, provider, model, prompt_version]
      properties:
        provider: { type: string, enum: [ark, openrouter, openai, deterministic] }
        model: { type: string }
        prompt_version: { type: string, enum: [knowledge-v1] }
        result:
          type: object
          additionalProperties: false
          required: [title, points, relations]
          properties:
            title: { type: string, minLength: 1, maxLength: 80 }
            points:
              type: array
              minItems: 1
              maxItems: 16
              description: 所有已选卡片至少被引用一次；共同观点和分歧必须引用至少两张不同卡片。
              items:
                type: object
                additionalProperties: false
                required: [kind, text, evidence]
                properties:
                  kind: { type: string, enum: [summary, agreement, difference, question] }
                  text: { type: string, minLength: 1, maxLength: 1200 }
                  evidence:
                    type: array
                    minItems: 1
                    maxItems: 8
                    items: { $ref: '#/components/schemas/KnowledgeEvidence' }
            relations:
              type: array
              maxItems: 12
              items: { $ref: '#/components/schemas/KnowledgeRelation' }
    CaptureBatchRequest:
      type: object
      required: [captures]
      additionalProperties: false
      properties:
        captures:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ClipEvent' }
    ClipEvent:
      type: object
      required: [client_capture_id, raw_text, mode]
      additionalProperties: false
      properties:
        client_capture_id: { type: string, minLength: 1 }
        raw_text: { type: string, minLength: 1 }
        text_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: raw_text UTF-8 字节的小写 SHA-256，可选但提供时必须匹配。
        source_app: { type: string }
        source_url: { type: string }
        mode: { type: string, enum: [auto, confirm] }
        captured_at: { type: string, format: date-time }
        client_analysis: { $ref: '#/components/schemas/ClientAnalysis' }
    ClientAnalysis:
      type: object
      additionalProperties: false
      required: [provider, model, primary_tag, interpretation, books]
      description: 客户端 BYOK 的结构化结果；API key 不得提交到 backend。
      properties:
        provider: { type: string, enum: [ark, openrouter] }
        model: { type: string, minLength: 1, maxLength: 200 }
        primary_tag: { type: string, enum: [人文, 商业, 技术, 认知, 职场, 社会, 随笔] }
        interpretation: { $ref: '#/components/schemas/Interpretation' }
        books:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ClientBook' }
    Interpretation:
      type: object
      additionalProperties: false
      required: [summary, insight, action]
      properties:
        summary: { type: string, minLength: 1, maxLength: 2000 }
        insight: { type: string, minLength: 1, maxLength: 4000 }
        action: { type: string, minLength: 1, maxLength: 2000 }
    ClientBook:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        author: { type: string, maxLength: 200 }
    CardVersion:
      type: object
      required: [id, card_id, number, created_at, clean_text, primary_tag, interpretation, books, llm_provider, llm_model, markdown]
      properties:
        id: { type: string }
        card_id: { type: string }
        number: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        clean_text: { type: string }
        primary_tag: { type: string }
        interpretation: { $ref: '#/components/schemas/Interpretation' }
        books: { type: array, items: { type: object } }
        llm_provider: { type: string, enum: [ark, openrouter, openai, deterministic] }
        llm_model: { type: string }
        markdown: { type: string }
    AcceptedCapture:
      type: object
      required: [client_capture_id, capture_id, card_id]
      properties:
        client_capture_id: { type: string }
        capture_id: { type: string }
        card_id: { type: string }
        duplicate: { type: boolean }
    RejectedCapture:
      type: object
      required: [code, message]
      properties:
        client_capture_id: { type: string }
        code: { type: string }
        message: { type: string }
    CaptureBatchResponse:
      type: object
      required: [accepted, rejected]
      properties:
        accepted:
          type: array
          items: { $ref: '#/components/schemas/AcceptedCapture' }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/RejectedCapture' }
